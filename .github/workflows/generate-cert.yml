name: Generate Certificate
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Run at 00:00 on the 1st of every month
env:
  ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
  DOMAIN: ${{ vars.DOMAIN }}
  SUBDOMAINS: ${{ vars.SUBDOMAINS }}
  DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
  OCI_CLI_REGION: ${{ vars.OCI_REGION }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
  OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
  OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
  OCI_CLI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
  OCI_VAULT_ID: ${{ vars.OCI_VAULT_ID }}
  OCI_KMS_SSL_KEY_ID: ${{ vars.OCI_KMS_SSL_KEY_ID }}
  OCI_LB_ID: ${{ vars.OCI_LB_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache acme.sh
        uses: actions/cache@v4
        with:
          path: ~/.acme.sh
          key: acme-sh-${{ vars.SUBDOMAINS || vars.DOMAIN }}

      - name: Generate Certificate with acme.sh
        run: bash ./scripts/generate-cert.sh

      - name: Install OCI CLI
        run: pipx install oci-cli

      - name: Deploy Certificate to OCI Load Balancer and Vault
        run: bash ./scripts/deploy-cert-oci.sh
